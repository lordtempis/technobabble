name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package and test the Windows download
        shell: pwsh
        run: |
          .\windows\package.ps1
          $package = Get-Item .\windows\dist\Technobabble-*.zip
          $extracted = Join-Path $env:RUNNER_TEMP 'Technobabble release'
          Expand-Archive -LiteralPath $package.FullName -DestinationPath $extracted
          & (Join-Path $extracted 'source/tests/check.ps1')
          & (Join-Path $extracted 'source/tests/check.ps1') -Terminal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $package.FullName).Hash.ToLowerInvariant()
          "$hash  $($package.Name)" | Set-Content -Encoding ascii -LiteralPath "$($package.FullName).sha256"
      - name: Save the tested Windows ZIP and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: technobabble-windows
          path: |
            windows/dist/Technobabble-*.zip
            windows/dist/Technobabble-*.zip.sha256
          if-no-files-found: error
          compression-level: 0

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Install terminal test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pyte
      - name: Build and test the Linux application
        run: |
          dotnet build -c Release
          dotnet run -c Release --project tests/Checks.csproj
          /usr/bin/python3 tests/terminal.py ./bin/Release/net10.0/technobabble
          python3 package.py ./dist
      - name: Check the optional Windows bridge key decoder
        run: /usr/bin/python3 -B ../windows/source/tests/wsl-keys.py
      - name: Build the portable Linux archive
        run: |
          python3 package-portable.py ./dist
          python3 package.py ./dist/apt --portable ./dist/technobabble-*-linux-x64.tar.gz
      - name: Archive and build the Linux source download
        run: |
          version=$(dotnet msbuild Technobabble.csproj -nologo -getProperty:Version)
          archive="Technobabble-Linux-$version-source.tar.gz"
          git -C .. archive --format=tar.gz --prefix="technobabble-linux-$version/" -o "$PWD/dist/$archive" HEAD:linux
          (cd dist && sha256sum "$archive" > "$archive.sha256")
          tar -xzf "dist/$archive" -C "$RUNNER_TEMP"
          dotnet build "$RUNNER_TEMP/technobabble-linux-$version/Technobabble.csproj" -c Release
      - name: Save the Linux source and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: technobabble-linux-source
          path: |
            linux/dist/*-source.tar.gz
            linux/dist/*-source.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Run the extracted archive on Debian 13 without system .NET
        run: |
          docker run --rm --volume "$PWD:/src:ro" debian:13-slim sh -eu -c '
            apt-get update -qq
            apt-get install -y --no-install-recommends python3-pyte libicu76 libssl3t64 libstdc++6 zlib1g
            if command -v dotnet; then exit 1; fi
            cd /src/dist
            set -- technobabble-*-linux-x64.tar.gz
            test "$#" -eq 1
            sha256sum -c "$1.sha256"
            tar -xzf "$1" -C /tmp
            cd "/tmp/${1%.tar.gz}"
            ./technobabble --version
            /usr/bin/python3 /src/tests/terminal.py "$PWD/technobabble"
          '
      - name: Save the Debian-tested binary and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: technobabble-linux-x64
          path: |
            linux/dist/*-linux-x64.tar.gz
            linux/dist/*-linux-x64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Install, run and remove the bundled deb on Debian and Ubuntu
        run: |
          for image in debian:13-slim ubuntu:24.04; do
            docker run --rm --volume "$PWD:/src:ro" "$image" sh /src/tests/apt-install.sh local
          done
      - name: Save the tested Debian package and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: technobabble-deb-amd64
          path: |
            linux/dist/apt/*.deb
            linux/dist/apt/*.deb.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Build the revision 1 upgrade fixture from the v1.13 tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git -C .. fetch --no-tags --depth=1 origin tag v1.13
          fixture=$(mktemp -d)
          git -C .. archive v1.13 linux | tar -x -C "$fixture"
          python3 "$fixture/linux/package.py" "$PWD/dist/upgrade-from-v1.13"
      - name: Verify the live signed repository on Debian and Ubuntu
        if: github.event_name == 'workflow_dispatch'
        run: |
          for image in debian:13-slim ubuntu:24.04; do
            docker run --rm --volume "$PWD:/src:ro" "$image" sh /src/tests/apt-install.sh public
          done
          docker run --rm --volume "$PWD:/src:ro" ubuntu:26.04 sh /src/tests/apt-install.sh upgrade
          docker run --rm --volume "$PWD:/src:ro" debian:13-slim sh /src/tests/apt-install.sh upgrade-bundled
