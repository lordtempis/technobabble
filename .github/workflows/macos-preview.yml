name: macOS Tahoe 26 preview checks
on:
  push:
    branches: [preview/macos]
  workflow_dispatch:
  workflow_call:
    inputs:
      source-sha:
        description: Exact preview commit to build on both Mac runners
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos:
    name: macOS Tahoe 26 · ${{ matrix.cpu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
            cpu: Apple silicon (ARM64)
          - runner: macos-26-intel
            arch: x86_64
            cpu: Intel (x64)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify the Mac runner
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/mac-ci"
          exec > >(tee "$RUNNER_TEMP/mac-ci/host.log") 2>&1
          sw_vers
          uname -m
          xcodebuild -version
          clang --version
          python3 --version
          version=$(sw_vers -productVersion)
          test "${version%%.*}" = 26
          test "$(uname -m)" = "$EXPECTED_ARCH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Build self-contained installer
        run: |
          exec > >(tee "$RUNNER_TEMP/mac-ci/build.log") 2>&1
          git rev-parse HEAD
          dotnet --info
          python3 macos/package.py
      - name: Install the package and verify the payload
        run: |
          exec > >(tee "$RUNNER_TEMP/mac-ci/install.log") 2>&1
          cd macos/dist
          shasum -a 256 -c *.sha256
          sudo installer -pkg ./*.pkg -target /
          pkgutil --pkg-info io.github.lordtempis.technobabble.cli
          for binary in technobabble libtechnobabble-sensors.dylib libcoreclr.dylib; do
            test "$(lipo -archs "/usr/local/lib/technobabble/$binary")" = "${{ matrix.arch }}"
          done
          doc=/usr/local/share/doc/technobabble
          cmp ../../linux/NOTICE.txt "$doc/NOTICE.txt"
          test -s "$doc/dotnet-notices/THIRD-PARTY-NOTICES.TXT"
          test -s "$doc/dotnet-notices/LICENSE.TXT"
          for name in technobabble technobabble-terminal; do
            cmp "../../linux/man/technobabble.1" "/usr/local/share/man/man1/$name.1"
            MANPAGER=cat man 1 "$name" | col -bx > "$RUNNER_TEMP/$name.manual"
            grep -Fq TECHNOBABBLE_LAYOUT_DIR "$RUNNER_TEMP/$name.manual"
          done
      - name: Run shared Studio regression tests
        env:
          DYLD_LIBRARY_PATH: /usr/local/lib/technobabble
        run: |
          dotnet run -c Release --project macos/tests/Checks.csproj 2>&1 | tee "$RUNNER_TEMP/mac-ci/studio.log"
      - name: Test the installed app in a real terminal
        run: |
          exec > >(tee "$RUNNER_TEMP/mac-ci/terminal.log") 2>&1
          python3 -m venv "$RUNNER_TEMP/pty"
          "$RUNNER_TEMP/pty/bin/pip" install pyte==0.8.2
          "$RUNNER_TEMP/pty/bin/python" macos/tests/installed.py
      - name: Save verified preview installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: technobabble-macos-tahoe-26-${{ matrix.arch }}
          path: |
            macos/dist/*.pkg
            macos/dist/*.pkg.sha256
          compression-level: 0
          if-no-files-found: error
      - name: Check ARM64 cross-build on Intel (build only)
        if: matrix.arch == 'x86_64'
        run: |
          exec > >(tee "$RUNNER_TEMP/mac-ci/arm64-cross-build.log") 2>&1
          out="$RUNNER_TEMP/arm64-publish"
          dotnet publish macos/Technobabble.csproj -c Release -r osx-arm64 --self-contained true \
            --source https://api.nuget.org/v3/index.json -o "$out"
          for binary in technobabble libtechnobabble-sensors.dylib libcoreclr.dylib; do
            arch=$(lipo -archs "$out/$binary")
            echo "$binary: $arch"
            test "$arch" = arm64
          done
      - name: Save diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-tahoe-26-${{ matrix.arch }}-diagnostics
          path: ${{ runner.temp }}/mac-ci/*.log
          if-no-files-found: warn
