name: macOS preview installers
on:
  push:
    branches: [preview/macos]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Build self-contained installer
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          sw_vers
          python3 macos/package.py
      - name: Install the package and verify the payload
        run: |
          cd macos/dist
          shasum -a 256 -c *.sha256
          sudo installer -pkg ./*.pkg -target /
          pkgutil --pkg-info io.github.lordtempis.technobabble.cli
          for binary in technobabble libtechnobabble-sensors.dylib libcoreclr.dylib; do
            test "$(lipo -archs "/usr/local/lib/technobabble/$binary")" = "${{ matrix.arch }}"
          done
          doc=/usr/local/share/doc/technobabble
          cmp ../../linux/NOTICE.txt "$doc/NOTICE.txt"
          test -s "$doc/dotnet-notices/THIRD-PARTY-NOTICES.TXT"
          test -s "$doc/dotnet-notices/LICENSE.TXT"
          for name in technobabble technobabble-terminal; do
            cmp "../../linux/man/technobabble.1" "/usr/local/share/man/man1/$name.1"
            MANPAGER=cat man 1 "$name" | col -bx > "$RUNNER_TEMP/$name.manual"
            grep -Fq TECHNOBABBLE_LAYOUT_DIR "$RUNNER_TEMP/$name.manual"
          done
      - name: Test the installed app in a real terminal
        run: |
          python3 -m venv "$RUNNER_TEMP/pty"
          "$RUNNER_TEMP/pty/bin/pip" install pyte==0.8.2
          "$RUNNER_TEMP/pty/bin/python" macos/tests/installed.py
      - name: Save verified preview installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: technobabble-macos-${{ matrix.arch }}
          path: |
            macos/dist/*.pkg
            macos/dist/*.pkg.sha256
          compression-level: 0
          if-no-files-found: error
